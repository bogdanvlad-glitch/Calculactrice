name: Générer un AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Consulter le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer outils système
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses

      - name: Installer les outils Android nécessaires
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configurer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Initialiser le projet Android
        run: |
          mkdir twa
          cd twa

          expect <<'EOF'
          set timeout 120
          spawn bubblewrap init --manifest=https://bogdanvlad-glitch.github.io/Calculactrice/manifest.json --directory=. --skipPwaValidation

          expect {
            "install the JDK" {
              send "n\r"
              exp_continue
            }
            "Domain:" {
              send "bogdanvlad-glitch.github.io\r"
              exp_continue
            }
            "URL path:" {
              send "/Calculactrice/\r"
              exp_continue
            }
            "Application name" {
              send "WrongCalc\r"
              exp_continue
            }
            "Launcher name" {
              send "WrongCalc\r"
              exp_continue
            }
            "Package ID" {
              send "com.bogdan.wrongcalc\r"
              exp_continue
            }
            "Version name" {
              send "1.0.0\r"
              exp_continue
            }
            "Version code" {
              send "1\r"
              exp_continue
            }
            "Display mode" {
              send "\r"
              exp_continue
            }
            "Orientation" {
              send "portrait\r"
              exp_continue
            }
            "Status bar color" {
              send "#000000\r"
              exp_continue
            }
            "Navigation bar color" {
              send "#000000\r"
              exp_continue
            }
            "Splash screen color" {
              send "#000000\r"
              exp_continue
            }
            "Theme color" {
              send "#000000\r"
              exp_continue
            }
            "Background color" {
              send "#000000\r"
              exp_continue
            }
            "Do you want" {
              send "\r"
              exp_continue
            }
            eof
          }
          EOF

      - name: Construire le AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: wrongcalc123
          BUBBLEWRAP_KEY_PASSWORD: wrongcalc123
        run: |
          cd twa

          expect <<'EOF'
          set timeout 300
          spawn bubblewrap build

          expect {
            "password" {
              send "wrongcalc123\r"
              exp_continue
            }
            "Password" {
              send "wrongcalc123\r"
              exp_continue
            }
            "yes/no" {
              send "yes\r"
              exp_continue
            }
            "Accept" {
              send "y\r"
              exp_continue
            }
            "Do you accept" {
              send "y\r"
              exp_continue
            }
            eof
          }
          EOF

            - name: Chercher les fichiers générés
        run: |
          find twa -type f | sort
          echo "Fichiers AAB/APK trouvés :"
          find twa -type f \( -name "*.aab" -o -name "*.apk" \)

      - name: Téléverser les fichiers de compilation
        uses: actions/upload-artifact@v4
        with:
          name: WrongCalc-android-build
          path: |
            twa/app/build/outputs/bundle/**/*.aab
            twa/app/build/outputs/apk/**/*.apk
            twa/**/*.aab
            twa/**/*.apk
