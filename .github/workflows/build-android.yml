name: Générer un AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Consulter le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses

      - name: Installer les outils Android nécessaires
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configurer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Initialiser le projet Android
        run: |
          mkdir twa
          cd twa
          printf "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n" | bubblewrap init \
            --manifest=https://bogdanvlad-glitch.github.io/Calculactrice/manifest.json \
            --directory=. \
            --packageId=com.bogdan.wrongcalc \
            --name=WrongCalc \
            --launcherName=WrongCalc \
            --display=standalone \
            --orientation=portrait \
            --themeColor=#000000 \
            --backgroundColor=#000000 \
            --startUrl=https://bogdanvlad-glitch.github.io/Calculactrice/ \
            --iconUrl=https://bogdanvlad-glitch.github.io/Calculactrice/icon-512.png \
            --skipPwaValidation

      - name: Construire le AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: wrongcalc123
          BUBBLEWRAP_KEY_PASSWORD: wrongcalc123
        run: |
          cd twa
          printf "\n\n\n\n\n\n\n\n\n\n" | bubblewrap build

      - name: Chercher les fichiers générés
        run: |
          find twa -name "*.aab" -o -name "*.apk"

      - name: Téléverser les fichiers de compilation
        uses: actions/upload-artifact@v4
        with:
          name: WrongCalc-android-build
          path: |
            twa/**/*.aab
            twa/**/*.apk
