name: Générer un AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Consulter le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer outils système
        run: |
          sudo apt-get update
          sudo apt-get install -y expect zip

      - name: Accepter les licences Android
        run: |
          yes | sdkmanager --licenses

      - name: Installer les outils Android nécessaires
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Configurer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Initialiser le projet Android
        run: |
          mkdir -p twa
          cd twa

          expect <<'EOF'
          set timeout 180

          spawn bubblewrap init --manifest=https://bogdanvlad-glitch.github.io/Calculactrice/manifest.json --directory=. --skipPwaValidation

          expect {
            -re "install the JDK" {
              send "n\r"
              exp_continue
            }
            -re "Domain:" {
              send "\r"
            }
          }

          expect -re "URL path:"
          send "\r"

          expect -re "Application name"
          send "WrongCalc\r"

          expect -re "Launcher name"
          send "WrongCalc\r"

          expect -re "Package ID"
          send "com.bogdan.wrongcalc\r"

          expect -re "Version name"
          send "1.0.0\r"

          expect -re "Version code"
          send "1\r"

          expect -re "Display mode"
          send "\r"

          expect -re "Orientation"
          send "portrait\r"

          expect -re "Status bar color"
          send "#000000\r"

          expect -re "Navigation bar color"
          send "#000000\r"

          expect -re "Splash screen color"
          send "#000000\r"

          expect -re "Theme color"
          send "#000000\r"

          expect -re "Background color"
          send "#000000\r"

          expect {
            -re "Do you want" {
              send "\r"
              exp_continue
            }
            eof
          }
          EOF

          echo "Contenu du dossier twa après init :"
          ls -la

          if [ ! -f "twa-manifest.json" ]; then
            echo "ERREUR: twa-manifest.json absent."
            exit 1
          fi

      - name: Construire avec Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: wrongcalc123
          BUBBLEWRAP_KEY_PASSWORD: wrongcalc123
        run: |
          cd twa

          expect <<'EOF'
          set timeout 300

          spawn bubblewrap build --skipPwaValidation

          expect {
            -re "password" {
              send "wrongcalc123\r"
              exp_continue
            }
            -re "Password" {
              send "wrongcalc123\r"
              exp_continue
            }
            -re "yes/no" {
              send "yes\r"
              exp_continue
            }
            -re "Accept" {
              send "y\r"
              exp_continue
            }
            -re "Do you accept" {
              send "y\r"
              exp_continue
            }
            eof
          }
          EOF

      - name: Vérifier les fichiers générés
        run: |
          echo "Tous les fichiers générés :"
          find twa -type f | sort

          echo "Fichiers APK/AAB :"
          find twa -type f \( -name "*.aab" -o -name "*.apk" \) -print || true

      - name: Préparer les fichiers Android
        run: |
          mkdir -p output

          find twa -type f -name "*.aab" -exec cp {} output/ \; || true
          find twa -type f -name "*.apk" -exec cp {} output/ \; || true

          echo "Contenu de output :"
          ls -la output

          test -n "$(find output -type f \( -name '*.aab' -o -name '*.apk' \) -print -quit)"

      - name: Téléverser les fichiers Android
        uses: actions/upload-artifact@v4
        with:
          name: WrongCalc-android-build
          path: output/*
