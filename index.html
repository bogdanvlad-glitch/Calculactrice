<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WrongCalc</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .phone {
      position: relative;
      width: min(100vw, 430px);
      height: min(100vh, 932px);
      background: #000;
      padding: 18px 18px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .status-bar {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      z-index: 5;
    }

    .brand {
      position: absolute;
      top: 42px;
      left: 24px;
      color: rgba(255, 255, 255, 0.25);
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .display {
      height: 310px;
      padding-top: 80px;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      overflow: hidden;
    }

    .expression {
      width: 100%;
      min-height: 70px;
      max-height: 130px;
      padding: 0 2px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 24px;
      font-weight: 300;
      line-height: 1.2;
      text-align: right;
      white-space: normal;
      word-break: break-all;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .expression::-webkit-scrollbar {
      display: none;
    }

    .result {
      width: 100%;
      min-height: 82px;
      color: #fff;
      font-size: clamp(48px, 15vw, 76px);
      font-weight: 200;
      line-height: 1;
      letter-spacing: -3px;
      text-align: right;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      outline: none;
      height: clamp(72px, 18vw, 88px);
      border-radius: 999px;
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 400;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.12s ease, background 0.12s ease;
    }

    button:active {
      transform: scale(0.94);
      filter: brightness(1.22);
    }

    .dark {
      background: #333333;
      color: #fff;
    }

    .light {
      background: #a5a5a5;
      color: #050505;
    }

    .orange {
      background: #ff9f0a;
      color: #fff;
    }

    .orange.active {
      background: #fff;
      color: #ff9f0a;
    }

    .zero {
      grid-column: span 2;
      text-align: left;
      padding-left: 31px;
    }

    .tiny {
      font-size: clamp(22px, 6vw, 28px);
    }

    .home-indicator {
      width: 135px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      margin: 18px auto 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 112px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(32, 32, 32, 0.92);
      color: #fff;
      padding: 11px 16px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      transition: 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-height: 760px) {
      .display {
        height: 220px;
        padding-top: 55px;
      }

      .expression {
        min-height: 54px;
        max-height: 90px;
        font-size: 19px;
      }

      .result {
        min-height: 58px;
        font-size: 48px;
      }

      button {
        height: 64px;
        font-size: 28px;
      }

      .keys {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="status-bar" id="time">9:41</div>
    <div class="brand">WrongCalc</div>

    <section class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </section>

    <section class="keys" aria-label="Calculatrice">
      <button class="light tiny" data-action="backspace">⌫</button>
      <button class="light tiny" data-action="clear">C</button>
      <button class="light tiny" data-action="percent">%</button>
      <button class="orange" data-operator="÷">÷</button>

      <button class="dark" data-number="7">7</button>
      <button class="dark" data-number="8">8</button>
      <button class="dark" data-number="9">9</button>
      <button class="orange" data-operator="×">×</button>

      <button class="dark" data-number="4">4</button>
      <button class="dark" data-number="5">5</button>
      <button class="dark" data-number="6">6</button>
      <button class="orange" data-operator="−">−</button>

      <button class="dark" data-number="1">1</button>
      <button class="dark" data-number="2">2</button>
      <button class="dark" data-number="3">3</button>
      <button class="orange" data-operator="+">+</button>

      <button class="dark" data-action="sign">+/−</button>
      <button class="dark" data-number="0">0</button>
      <button class="dark" data-action="decimal">,</button>
      <button class="orange" data-action="equals">=</button>
    </section>

    <div class="home-indicator"></div>
  </main>

  <div class="toast" id="toast">Réponse certifiée fausse</div>

  <script>
    const resultEl = document.getElementById("result");
    const expressionEl = document.getElementById("expression");
    const toastEl = document.getElementById("toast");
    const timeEl = document.getElementById("time");

    let tokens = [];
    let current = "0";
    let justCalculated = false;

    const trollAnswers = [
      "42",
      "non",
      "jsp",
      "beaucoup",
      "peut-être",
      "ça dépend",
      "toi + moi",
      "erreur de vibe",
      "999",
      "-1",
      "∞",
      "presque",
      "demande à ton prof",
      "trop compliqué",
      "0, mais stylé"
    ];

    function updateTime() {
      const now = new Date();
      timeEl.textContent = now.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function isOperator(value) {
      return ["+", "−", "×", "÷"].includes(value);
    }

    function isNumberLike(value) {
      return value !== "" && Number.isFinite(Number(value));
    }

    function formatValue(value) {
      return String(value).replaceAll(".", ",");
    }

    function formatExpression(list) {
      return list.map(formatValue).join(" ");
    }

    function getFullCalculation() {
      const visibleTokens = [...tokens];

      if (current !== "" && !(tokens.length === 0 && current === "0")) {
        visibleTokens.push(current);
      }

      return formatExpression(visibleTokens);
    }

    function getBottomValue() {
      if (current !== "") return current;

      for (let i = tokens.length - 1; i >= 0; i--) {
        if (!isOperator(tokens[i])) return tokens[i];
      }

      return "0";
    }

    function updateDisplay() {
      const fullCalculation = getFullCalculation();

      expressionEl.textContent = fullCalculation;
      expressionEl.scrollTop = expressionEl.scrollHeight;
      resultEl.textContent = formatValue(getBottomValue());
    }

    function resetForNewNumber() {
      if (justCalculated || !isNumberLike(current)) {
        tokens = [];
        current = "0";
        justCalculated = false;
        setActiveOperator(null);
      }
    }

    function inputNumber(number) {
      resetForNewNumber();

      if (current === "0") {
        current = number;
      } else {
        current += number;
      }

      updateDisplay();
    }

    function inputDecimal() {
      resetForNewNumber();

      if (current === "") {
        current = "0.";
      } else if (!current.includes(".")) {
        current += ".";
      }

      updateDisplay();
    }

    function clearAll() {
      tokens = [];
      current = "0";
      justCalculated = false;
      setActiveOperator(null);
      updateDisplay();
    }

    function toggleSign() {
      resetForNewNumber();
      if (current === "0" || current === "") return;
      current = current.startsWith("-") ? current.slice(1) : "-" + current;
      updateDisplay();
    }

    function percent() {
      resetForNewNumber();
      current = String(parseFloat(current || "0") / 100);
      updateDisplay();
    }

    function chooseOperator(nextOperator) {
      if (justCalculated) {
        tokens = isNumberLike(current) ? [current] : [];
        justCalculated = false;
      }

      if (current !== "" && isNumberLike(current)) {
        tokens.push(current);
        current = "";
      }

      if (tokens.length === 0) {
        tokens.push("0");
      }

      if (isOperator(tokens[tokens.length - 1])) {
        tokens[tokens.length - 1] = nextOperator;
      } else {
        tokens.push(nextOperator);
      }

      setActiveOperator(nextOperator);
      updateDisplay();
    }

    function precedence(operator) {
      if (operator === "×" || operator === "÷") return 2;
      if (operator === "+" || operator === "−") return 1;
      return 0;
    }

    function applyOperator(a, b, operator) {
      switch (operator) {
        case "+": return a + b;
        case "−": return a - b;
        case "×": return a * b;
        case "÷": return b === 0 ? Infinity : a / b;
        default: return b;
      }
    }

    function evaluateTokens(rawTokens) {
      const values = [];
      const operators = [];

      function solveTop() {
        const operator = operators.pop();
        const b = values.pop();
        const a = values.pop();
        values.push(applyOperator(a, b, operator));
      }

      for (const token of rawTokens) {
        if (isOperator(token)) {
          while (
            operators.length &&
            precedence(operators[operators.length - 1]) >= precedence(token)
          ) {
            solveTop();
          }
          operators.push(token);
        } else {
          values.push(parseFloat(token));
        }
      }

      while (operators.length) {
        solveTop();
      }

      return values[0] ?? 0;
    }

    function makeWrongAnswer(realAnswer) {
      const random = Math.random();

      if (!Number.isFinite(realAnswer)) {
        return "nice try";
      }

      if (random < 0.22) {
        return trollAnswers[Math.floor(Math.random() * trollAnswers.length)];
      }

      const offsetOptions = [-99, -50, -11, -9, -5, -3, -2, -1, 1, 2, 3, 5, 7, 11, 25, 69];
      const offset = offsetOptions[Math.floor(Math.random() * offsetOptions.length)];
      let wrong = realAnswer + offset;

      if (wrong === realAnswer) wrong += 1;

      if (Math.abs(wrong) > 999999999) {
        return "trop grand";
      }

      if (Number.isInteger(wrong)) {
        return String(wrong);
      }

      return String(Number(wrong.toFixed(2)));
    }

    function calculateWrong() {
      if (current !== "" && isNumberLike(current)) {
        tokens.push(current);
      }

      if (tokens.length === 0) return;

      if (isOperator(tokens[tokens.length - 1])) {
        tokens.pop();
      }

      const finalExpression = formatExpression(tokens);
      const realAnswer = evaluateTokens(tokens);
      const wrongAnswer = makeWrongAnswer(realAnswer);

      expressionEl.textContent = finalExpression + " =";
      current = String(wrongAnswer);
      tokens = [];
      justCalculated = true;
      setActiveOperator(null);
      resultEl.textContent = formatValue(current);
      showToast();
    }

    function backspace() {
      if (justCalculated) {
        clearAll();
        return;
      }

      if (current.length > 1) {
        current = current.slice(0, -1);
      } else if (current.length === 1 && current !== "0") {
        current = "0";
      } else if (current === "" && tokens.length) {
        const last = tokens.pop();
        current = isOperator(last) ? "" : last;
      }

      updateDisplay();
    }

    function setActiveOperator(activeOperator) {
      document.querySelectorAll(".orange[data-operator]").forEach(button => {
        button.classList.toggle("active", button.dataset.operator === activeOperator);
      });
    }

    function showToast() {
      const messages = [
        "Réponse certifiée fausse",
        "Calcul vérifié par personne",
        "Maths interdites ici",
        "Erreur volontaire activée",
        "La vérité est overrated"
      ];

      toastEl.textContent = messages[Math.floor(Math.random() * messages.length)];
      toastEl.classList.add("show");

      setTimeout(() => {
        toastEl.classList.remove("show");
      }, 1300);
    }

    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        const number = button.dataset.number;
        const action = button.dataset.action;
        const nextOperator = button.dataset.operator;

        if (number !== undefined) inputNumber(number);
        if (nextOperator) chooseOperator(nextOperator);

        if (action === "clear") clearAll();
        if (action === "backspace") backspace();
        if (action === "sign") toggleSign();
        if (action === "percent") percent();
        if (action === "decimal") inputDecimal();
        if (action === "equals") calculateWrong();
      });
    });

    window.addEventListener("keydown", event => {
      const key = event.key;

      if ("0123456789".includes(key) && key.length === 1) inputNumber(key);
      if (key === "." || key === ",") inputDecimal();
      if (key === "+") chooseOperator("+");
      if (key === "-") chooseOperator("−");
      if (key === "*") chooseOperator("×");
      if (key === "x" || key === "X") chooseOperator("×");
      if (key === "/") chooseOperator("÷");
      if (key === "Enter" || key === "=") calculateWrong();
      if (key === "Backspace") backspace();
      if (key === "Escape") clearAll();
    });

    updateTime();
    setInterval(updateTime, 10000);
    updateDisplay();
  </script>
</body>
</html>
